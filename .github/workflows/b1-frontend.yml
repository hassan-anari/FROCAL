name: B1 frontend validation
on:
  pull_request:
    branches: [main]
  push:
    branches: ['ai/b1-frontend-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: b1-frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run validate:telegram-sdk
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b1-playwright-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 14
