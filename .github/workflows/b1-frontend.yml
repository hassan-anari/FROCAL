name: Frontend validation
on:
  pull_request:
    branches: [main]
  push:
    branches: ['ai/b1-frontend-*', 'ai/b2-frontend-*', 'ai/b3-frontend-*', 'ai/b4-*', 'ai/b5-*', 'ai/b6-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/contracts/requirements.txt
      - run: python scripts/contracts/generate_bootstrap_fixture.py --check
      - run: npm run check
      - run: npm run validate:telegram-sdk
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:visual:b4-baseline
      - run: npm run test:e2e:b4
      - run: npm run test:visual:b5-baseline
      - run: npm run test:visual:b5-clan-baseline
      - run: npm run test:e2e:b5
      - run: npm run test:visual:b6-baseline
      - run: npm run test:visual:b6-activity-baseline
      - run: npm run test:e2e:b6
      - run: git worktree add --detach work/post-b6-main e481ffa7e14b980b7e1922cc2d71e64374014596
      - run: POST_B6_BASELINE=1 npx playwright test --config playwright.post-b6.config.ts
      - run: npm run test:e2e:post-b6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-playwright-evidence
          path: |
            playwright-report/
            test-results/
            test-results-b4/
            docs/evidence/b4/
            docs/evidence/b5/
            docs/evidence/b6/
            docs/evidence/b6-zero-net/
            docs/evidence/post-b6/
            work/post-b6-before-results.json
            work/post-b6-after-results.json
            work/test-results-post-b6/
            work/test-results-b6/
            work/test-results-b5/
          retention-days: 14
  paired-b2:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: frocal_b2_ci
          POSTGRES_USER: b2_test
          POSTGRES_PASSWORD: isolated-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U b2_test -d frocal_b2_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_DB: frocal_b2_ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_USER: b2_test
      POSTGRES_PASSWORD: isolated-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hassan-anari/WEDCAL
          ref: 34328c76ba3377396660b1549bf8e370ac514a71
          path: work/backend
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
      - run: uv sync --frozen --python 3.13
        working-directory: work/backend
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run validate:contracts
      - run: npm run test:paired
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b2-paired-results
          path: test-results-paired/results.json
          retention-days: 14

  paired-b3:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: frocal_b3_ci
          POSTGRES_USER: b3_test
          POSTGRES_PASSWORD: isolated-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U b3_test -d frocal_b3_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      B4_AVAILABLE_APIS: '1'
      B4_RANKINGS_REDIS: '1'
      POSTGRES_DB: frocal_b3_ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_USER: b3_test
      POSTGRES_PASSWORD: isolated-test-only
      B3_BACKEND_ROOT: work/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
