name: Frontend validation
on:
  pull_request:
    branches: [main]
  push:
    branches: ['ai/b1-frontend-*', 'ai/b2-frontend-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/contracts/requirements.txt
      - run: python scripts/contracts/generate_bootstrap_fixture.py --check
      - run: npm run check
      - run: npm run validate:telegram-sdk
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-playwright-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 14
