<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dexo Land — Phase 0 v0.4 Preview</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:#01030a;color:#f5f7ff}body{display:grid;place-items:center;padding:24px}.phone{position:relative;isolation:isolate;width:min(100%,440px);height:min(900px,calc(100vh - 48px));min-height:620px;overflow:hidden;border:1px solid rgba(136,166,255,.16);border-radius:28px;background:#03050d;box-shadow:0 34px 90px rgba(0,0,0,.62),0 0 70px rgba(84,70,255,.11)}.bg{position:absolute;z-index:-7;inset:-10% -8% -7%;width:116%;height:117%;object-fit:cover;object-position:50% 71%;filter:saturate(1.04) contrast(1.08) brightness(.67);transform:scale(1.07);animation:drift 18s ease-in-out infinite alternate}.scrim{position:absolute;z-index:-6;inset:0;background:linear-gradient(180deg,rgba(1,3,11,.9) 0%,rgba(1,3,11,.46) 15%,rgba(1,3,11,.1) 39%,rgba(1,3,11,.2) 61%,rgba(1,3,11,.72) 82%,rgba(1,3,11,.98) 100%),radial-gradient(ellipse at 50% 30%,rgba(2,5,18,.12) 0 24%,rgba(1,3,11,.64) 82%)}.glow{position:absolute;z-index:-5;left:50%;top:28%;width:52%;aspect-ratio:.58;translate:-50% 0;border-radius:50%;background:radial-gradient(ellipse,rgba(105,82,255,.28),rgba(56,215,255,.08) 42%,transparent 72%);filter:blur(22px);animation:breathe 4.8s ease-in-out infinite}.sweep{position:absolute;z-index:-4;top:-18%;left:47%;width:12%;height:82%;rotate:5deg;background:linear-gradient(180deg,transparent,rgba(123,231,255,.14) 38%,rgba(150,91,255,.22) 62%,transparent);filter:blur(15px);mix-blend-mode:screen;animation:pulse 6.4s ease-in-out infinite}.content{position:relative;height:100%;padding:14px 15px 16px;display:grid;grid-template-rows:36px 1fr}.header{display:flex;align-items:center;padding-right:46px}.logo{width:104px;opacity:.94;filter:drop-shadow(0 8px 18px rgba(0,0,0,.35))}.dev{position:absolute;z-index:10;top:12px;right:13px;width:34px;height:34px;display:grid;place-items:center;border:1px solid rgba(157,193,255,.23);border-radius:12px;color:rgba(237,243,255,.8);background:linear-gradient(145deg,rgba(10,18,42,.78),rgba(3,7,20,.66));box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 24px rgba(0,0,0,.26);backdrop-filter:blur(14px)}.dev svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.hero{display:grid;grid-template-rows:auto 1fr auto;height:100%;padding:42px 0 2px;text-align:center}.copy{position:relative;display:grid;justify-items:center}.eyebrow{display:inline-flex;align-items:center;gap:8px;color:#a0efff;font-size:10px;font-weight:760;letter-spacing:.19em;line-height:1;text-transform:uppercase;text-shadow:0 3px 16px rgba(0,0,0,.75)}.eyebrow:before,.eyebrow:after{content:"";width:20px;height:1px;background:linear-gradient(90deg,transparent,rgba(121,229,255,.86))}.eyebrow:after{transform:scaleX(-1)}.aura{position:absolute;z-index:-1;top:22px;left:50%;width:min(82vw,340px);height:140px;translate:-50% 0;border-radius:50%;background:radial-gradient(ellipse,rgba(113,82,255,.22),transparent 66%);filter:blur(28px)}h1{position:relative;display:grid;width:100%;justify-items:center;margin:13px 0 10px;font-size:74px;font-weight:900;line-height:.79;letter-spacing:-.092em;text-transform:uppercase;text-shadow:0 18px 48px rgba(0,0,0,.62)}h1 span{display:block;padding-right:.08em}.dexo{color:#f8f9ff;text-shadow:0 1px 0 rgba(255,255,255,.45),0 16px 44px rgba(0,0,0,.58)}.land{position:relative;margin-top:.12em;color:transparent;background:linear-gradient(94deg,#7be9ff 5%,#9f85ff 48%,#d45dff 96%);background-clip:text;-webkit-background-clip:text;-webkit-text-stroke:1px rgba(196,224,255,.08);filter:drop-shadow(0 0 24px rgba(120,86,255,.26))}.land:after{content:"";position:absolute;left:12%;right:10%;bottom:-.21em;height:1px;background:linear-gradient(90deg,transparent,rgba(120,226,255,.72),rgba(184,95,255,.72),transparent);box-shadow:0 0 14px rgba(125,130,255,.42)}.subtitle{max-width:310px;margin:11px auto 0;color:rgba(228,233,250,.76);font-size:14px;font-weight:440;line-height:1.58;letter-spacing:-.01em;text-shadow:0 4px 18px rgba(0,0,0,.78)}.cta-wrap{align-self:end;display:grid;justify-items:center}.cta{position:relative;isolation:isolate;display:inline-flex;align-items:center;width:min(100%,306px);min-height:56px;padding:5px 6px 5px 20px;overflow:hidden;border:1px solid rgba(191,231,255,.26);border-radius:18px;color:#fff;background:linear-gradient(108deg,#42cfff 0%,#756cff 51%,#c84cff 100%);box-shadow:0 15px 40px rgba(83,86,255,.34),0 4px 16px rgba(52,213,255,.12),inset 0 1px 0 rgba(255,255,255,.34);font-size:15px;font-weight:750;letter-spacing:-.015em}.cta b{flex:1}.icon{display:grid;place-items:center;width:38px;height:38px;border:1px solid rgba(255,255,255,.2);border-radius:13px;background:rgba(5,8,24,.15);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}.icon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}@keyframes drift{from{transform:translate3d(-.8%,-.5%,0) scale(1.06)}to{transform:translate3d(.8%,.9%,0) scale(1.09)}}@keyframes breathe{0%,100%{opacity:.58;transform:scale(.96)}50%{opacity:.95;transform:scale(1.04)}}@keyframes pulse{0%,100%{opacity:.34;transform:translateX(-16%) scaleY(.94)}50%{opacity:.72;transform:translateX(18%) scaleY(1.05)}}@media(max-width:500px){body{padding:0}.phone{width:100%;height:100dvh;border:0;border-radius:0}h1{font-size:16.8vw}.hero{padding-top:5.6vh}}@media(max-height:700px){.hero{padding-top:14px}h1{font-size:60px}.subtitle{font-size:12px}.cta{width:min(100%,292px)}}
  </style>
</head>
<body>
  <main class="phone">
    <img class="bg" src="../public/assets/world/dexo-land-foundation.webp" alt="" />
    <div class="scrim"></div><div class="glow"></div><div class="sweep"></div>
    <div class="content">
      <header class="header"><img class="logo" src="../public/assets/brand/dalexio-logo.svg" alt="Dalexio" /></header>
      <button class="dev" aria-label="Open diagnostics"><svg viewBox="0 0 24 24"><path d="M4 13.5V10.5M20 13.5V10.5M13.5 4H10.5M13.5 20H10.5"/><circle cx="12" cy="12" r="5"/><path d="M12 9.5v3l2 1.2"/></svg></button>
      <section class="hero">
        <div class="copy">
          <span class="eyebrow">Your journey begins here</span><div class="aura"></div>
          <h1 aria-label="Dexo Land"><span class="dexo">Dexo</span><span class="land">Land</span></h1>
          <p class="subtitle">Enter a living world where every mission shapes your Dexo, your clan and your season.</p>
        </div>
        <div></div>
        <div class="cta-wrap"><button class="cta"><b>Enter Dexo Land</b><span class="icon"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button></div>
      </section>
    </div>
  </main>
</body>
</html>
