<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dexo Land Phase 0 Preview</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:#01030a;color:#f5f7ff}body{display:grid;place-items:start center;padding:24px;min-width:320px;background:radial-gradient(circle at 50% 0%,rgba(92,78,255,.16),transparent 32rem),#01030a}.viewport{position:relative;width:min(100%,460px);height:min(920px,calc(100vh - 48px));min-height:560px;overflow:hidden;border:1px solid rgba(136,166,255,.18);border-radius:28px;box-shadow:0 34px 90px rgba(0,0,0,.62),0 0 70px rgba(84,70,255,.12);background:#03050d}.stage{position:relative;isolation:isolate;width:100%;height:100%;overflow:hidden;padding:.8rem .9rem .85rem}.backdrop{position:absolute;z-index:-5;inset:-3%;width:106%;height:106%;object-fit:cover;object-position:50% 46%;filter:saturate(.92) contrast(1.08) brightness(.5);transform:scale(1.04)}.scrim{position:absolute;z-index:-4;inset:0;background:linear-gradient(180deg,rgba(2,4,12,.66),rgba(2,4,12,.14) 32%,rgba(2,4,12,.44) 65%,rgba(2,4,12,.94)),radial-gradient(circle at 50% 48%,transparent 0 22%,rgba(2,4,12,.26) 58%,rgba(2,4,12,.76))}.light{position:absolute;z-index:-3;left:50%;top:13%;width:44%;height:58%;transform:translateX(-50%);background:linear-gradient(180deg,rgba(82,226,255,.16),rgba(143,75,255,.1) 54%,transparent);filter:blur(34px);clip-path:polygon(42% 0,58% 0,100% 100%,0 100%)}header{display:flex;align-items:center;justify-content:space-between;gap:.65rem}.logo{width:112px;height:auto}.pill{display:inline-flex;align-items:center;gap:.38rem;min-height:28px;padding:0 .65rem;border:1px solid rgba(130,187,255,.22);border-radius:999px;color:rgba(218,227,255,.8);background:rgba(4,10,25,.58);font-size:.61rem;font-weight:760}.pill i{width:6px;height:6px;border-radius:50%;background:#53e7b1;box-shadow:0 0 14px rgba(83,231,177,.7)}.world{display:grid;grid-template-rows:auto minmax(180px,1fr) auto;align-items:center;height:calc(100% - 38px);padding:clamp(1.5rem,5.8vh,3rem) 0 .2rem;text-align:center}.eyebrow{color:#8deeff;font-size:.66rem;font-weight:850;letter-spacing:.16em;text-transform:uppercase}h1{margin:.45rem 0 .25rem;font-size:clamp(2.7rem,13vw,4.1rem);line-height:.88;letter-spacing:-.065em;text-transform:uppercase;text-shadow:0 18px 50px rgba(0,0,0,.52)}.copy p{max-width:300px;margin:.7rem auto 0;color:#be8cff;font-size:clamp(.9rem,4vw,1.02rem);font-weight:740}.core{position:relative;align-self:center;justify-self:center;display:grid;place-items:center;width:clamp(174px,48vw,224px);aspect-ratio:1}.outer,.middle,.gem{position:absolute;display:block}.outer{inset:0;border:1px solid rgba(74,219,255,.34);border-radius:42% 58% 56% 44%/48% 42% 58% 52%;box-shadow:inset 0 0 48px rgba(64,219,255,.08),0 0 48px rgba(82,95,255,.08)}.middle{inset:16%;border:1px solid rgba(189,112,255,.45);border-radius:34%;transform:rotate(45deg);background:linear-gradient(135deg,rgba(69,221,255,.08),rgba(150,83,255,.14));box-shadow:inset 0 0 46px rgba(83,117,255,.15),0 0 38px rgba(114,91,255,.16)}.gem{width:31%;aspect-ratio:1;transform:rotate(45deg);border:1px solid rgba(255,255,255,.62);border-radius:22%;background:linear-gradient(135deg,#45ddff,#8c62ff 55%,#d65cff);box-shadow:0 0 24px rgba(80,219,255,.48),0 0 58px rgba(146,77,255,.46),inset 0 0 17px rgba(255,255,255,.34)}.core label{position:absolute;bottom:4%;color:rgba(218,229,255,.68);font-size:.56rem;font-weight:850;letter-spacing:.23em}.actions{align-self:end;display:grid;justify-items:center;gap:.72rem}.description{max-width:315px;margin:0;color:#a8b3d2;font-size:.78rem;line-height:1.55}.button{width:min(100%,330px);min-height:54px;border:0;border-radius:999px;color:#fff;background:linear-gradient(135deg,#45ddff,#8c62ff 55%,#d65cff);box-shadow:0 10px 36px rgba(95,94,255,.34);font-weight:750;letter-spacing:.04em}.identity{color:rgba(186,199,232,.58);font-size:.66rem;letter-spacing:.04em}@media(max-width:519px){body{display:block;padding:0}.viewport{width:100%;height:100dvh;border:0;border-radius:0;box-shadow:none}}@media(max-height:680px){.world{grid-template-rows:auto minmax(140px,1fr) auto;padding-top:1rem}h1{font-size:clamp(2.45rem,11vw,3.2rem)}.core{width:clamp(146px,38vw,180px)}.description{display:none}}
  </style>
</head>
<body>
  <div class="viewport">
    <main class="stage">
      <img class="backdrop" src="../public/assets/world/dexo-land-foundation.webp" alt="" />
      <div class="scrim"></div><div class="light"></div>
      <header><img class="logo" src="../public/assets/brand/dalexio-logo.svg" alt="Dalexio"><span class="pill"><i></i>Telegram connected</span></header>
      <section class="world">
        <div class="copy"><span class="eyebrow">Phase 0 · Foundation</span><h1>Dexo Land</h1><p>The world core is ready.</p></div>
        <div class="core"><span class="outer"></span><span class="middle"></span><span class="gem"></span><label>FOUNDATION</label></div>
        <div class="actions"><p class="description">Telegram runtime, assets, mock contracts and motion guardrails are online.</p><button class="button">Verify foundation</button><span class="identity">@dalexio_dev_bot</span></div>
      </section>
    </main>
  </div>
</body>
</html>
