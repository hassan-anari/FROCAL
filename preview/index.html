<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Dexo Land — Phase 0 Preview</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:#03050d;color:#f5f7ff}body{overflow:hidden}.stage{position:relative;isolation:isolate;min-height:100dvh;padding:24px;display:flex;flex-direction:column}.bg{position:absolute;z-index:-5;inset:-5%;width:110%;height:110%;object-fit:cover;filter:saturate(.9) contrast(1.08) brightness(.58)}.scrim{position:absolute;z-index:-4;inset:0;background:linear-gradient(90deg,rgba(2,5,14,.96),rgba(3,7,18,.72) 48%,rgba(2,5,14,.35) 75%,rgba(2,5,14,.82)),linear-gradient(180deg,rgba(2,5,14,.5),transparent,rgba(2,5,14,.9))}.header{display:flex;justify-content:space-between;align-items:center;max-width:1240px;width:100%;margin:auto auto 0}.logo{width:180px}.chip{padding:8px 13px;border:1px solid rgba(120,210,255,.28);border-radius:999px;background:rgba(4,10,24,.64);font-size:11px;letter-spacing:.12em;text-transform:uppercase}.chip:before{content:"";display:inline-block;width:7px;height:7px;margin-right:8px;border-radius:50%;background:#53e7b1;box-shadow:0 0 13px #53e7b1}.hero{display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:80px;max-width:1240px;width:100%;flex:1;margin:auto;padding-bottom:100px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.16em;color:#8deeff;text-transform:uppercase}.copy h1{font-size:clamp(72px,11vw,132px);line-height:.85;letter-spacing:-.075em;margin:15px 0 8px;text-transform:uppercase}.subtitle{font-size:24px;font-weight:700;color:#be8cff;margin:0}.desc{max-width:580px;color:#a8b3d2;line-height:1.7}.actions{display:flex;gap:12px;margin-top:25px}.btn{padding:16px 23px;border:0;border-radius:999px;color:#fff;font-weight:800;letter-spacing:.05em;background:linear-gradient(135deg,#45ddff,#8c62ff 55%,#d65cff)}.btn.secondary{border:1px solid rgba(119,209,255,.38);background:rgba(7,15,34,.75)}.core{position:relative;width:min(39vw,430px);aspect-ratio:1;justify-self:center;filter:drop-shadow(0 28px 75px rgba(90,70,255,.45))}.ring{position:absolute;inset:5%;border:1px solid rgba(126,224,255,.45);border-radius:50%;box-shadow:inset 0 0 65px rgba(75,190,255,.1)}.square{position:absolute;inset:20%;border:1px solid rgba(190,132,255,.55);transform:rotate(45deg);background:linear-gradient(135deg,rgba(69,221,255,.08),rgba(150,83,255,.15));box-shadow:0 0 48px rgba(114,91,255,.25)}.gem{position:absolute;width:28%;aspect-ratio:1;left:36%;top:36%;transform:rotate(45deg);border:1px solid rgba(255,255,255,.8);border-radius:18%;background:linear-gradient(135deg,#45ddff,#8c62ff 55%,#d65cff);box-shadow:0 0 36px rgba(80,219,255,.6),0 0 90px rgba(146,77,255,.55)}.rail{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);display:grid;grid-template-columns:repeat(4,1fr);width:min(calc(100% - 40px),980px);border:1px solid rgba(123,197,255,.2);border-radius:18px;overflow:hidden;background:rgba(4,9,22,.72);backdrop-filter:blur(18px)}.rail div{padding:14px 18px;border-right:1px solid rgba(151,176,255,.12)}.rail div:last-child{border:0}.rail span{display:block;color:#6f7b9e;font-size:10px;letter-spacing:.1em;text-transform:uppercase}.rail strong{display:block;margin-top:5px;font-size:13px}@media(max-width:760px){.stage{padding:15px}.logo{width:140px}.hero{grid-template-columns:1fr;text-align:center;gap:10px;align-content:start;padding-top:12vh}.copy h1{font-size:20vw}.desc{margin-inline:auto}.actions{justify-content:center;flex-wrap:wrap}.core{position:absolute;width:430px;right:-190px;bottom:80px;opacity:.7}.rail{grid-template-columns:repeat(3,1fr);bottom:10px;width:calc(100% - 20px)}.rail div{padding:12px 10px}.rail div:last-child{display:none}}
</style>
</head>
<body>
<main class="stage">
<img class="bg" src="../public/assets/world/dexo-land-foundation.webp" alt="" />
<div class="scrim"></div>
<header class="header"><img class="logo" src="../public/assets/brand/dalexio-logo.svg" alt="Dalexio"/><span class="chip">Foundation online</span></header>
<section class="hero"><div class="copy"><span class="eyebrow">Dalexio Mini App · Phase 0</span><h1>Dexo Land</h1><p class="subtitle">The world foundation is online.</p><p class="desc">A Telegram-native game shell built for progression, missions, clans, competition and two living seasons.</p><div class="actions"><button class="btn">Initialize world</button><button class="btn secondary">Open diagnostics</button></div></div><div class="core"><span class="ring"></span><span class="square"></span><span class="gem"></span></div></section>
<footer class="rail"><div><span>Runtime</span><strong>browser</strong></div><div><span>Season</span><strong>prelaunch</strong></div><div><span>Player</span><strong>LV.1</strong></div><div><span>Foundation sync</span><strong>24%</strong></div></footer>
</main>
</body>
</html>
