<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dexo Land — Phase 0 v0.3 Preview</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:#01030a;color:#f5f7ff}body{display:grid;place-items:center;padding:24px}.phone{position:relative;width:min(100%,430px);height:min(900px,calc(100vh - 48px));min-height:600px;overflow:hidden;border:1px solid rgba(136,166,255,.18);border-radius:28px;background:#03050d;box-shadow:0 34px 90px rgba(0,0,0,.62),0 0 70px rgba(84,70,255,.12)}.bg{position:absolute;inset:-2%;width:104%;height:104%;object-fit:cover;object-position:50% 48%;filter:saturate(.98) contrast(1.06) brightness(.58);transform:scale(1.015)}.scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(1,3,10,.78) 0%,rgba(1,3,10,.28) 24%,rgba(1,3,10,.12) 48%,rgba(1,3,10,.58) 76%,rgba(1,3,10,.96) 100%),radial-gradient(circle at 50% 44%,transparent 0 22%,rgba(2,4,13,.18) 54%,rgba(2,4,13,.7) 100%)}.atmo{position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,rgba(103,86,255,.18),transparent 27%),linear-gradient(90deg,rgba(40,210,255,.06),transparent 24% 76%,rgba(186,79,255,.07));mix-blend-mode:screen}.content{position:relative;height:100%;padding:14px 15px 15px;display:grid;grid-template-rows:38px 1fr}.header{display:flex;align-items:center;padding-right:48px}.logo{width:108px}.dev{position:absolute;top:12px;right:12px;width:36px;height:36px;display:grid;place-items:center;border:1px solid rgba(139,183,255,.28);border-radius:13px;color:rgba(232,239,255,.82);background:rgba(5,10,24,.66);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 12px 30px rgba(0,0,0,.28);font-size:19px}.hero{display:grid;grid-template-rows:auto 1fr auto;height:100%;padding:28px 0 2px;text-align:center}.copy{display:grid;justify-items:center}.eyebrow{display:flex;align-items:center;gap:7px;color:#8deeff;font-size:10px;font-weight:850;letter-spacing:.18em;text-transform:uppercase}.eyebrow:before,.eyebrow:after{content:"";width:22px;height:1px;background:linear-gradient(90deg,transparent,rgba(111,230,255,.84))}.eyebrow:after{transform:scaleX(-1)}h1{display:grid;justify-items:center;margin:10px 0 8px;font-size:72px;line-height:.78;letter-spacing:-.075em;text-transform:uppercase;text-shadow:0 20px 58px rgba(0,0,0,.62)}.dexo{color:#f8f9ff}.land{margin-top:.12em;color:transparent;background:linear-gradient(96deg,#8ff0ff 4%,#a987ff 54%,#e36cff 98%);background-clip:text;-webkit-background-clip:text;filter:drop-shadow(0 0 28px rgba(130,96,255,.3))}.subtitle{max-width:315px;margin:9px auto 0;color:rgba(224,231,255,.78);font-size:14px;line-height:1.55;text-shadow:0 4px 18px rgba(0,0,0,.68)}.cta{align-self:end;width:min(100%,340px);min-height:58px;margin:0 auto;border:0;border-radius:999px;color:#fff;background:linear-gradient(135deg,#45ddff 0%,#8c62ff 55%,#d65cff 100%);box-shadow:0 16px 42px rgba(104,76,255,.38),0 0 38px rgba(72,214,255,.12),inset 0 1px 0 rgba(255,255,255,.34);font-weight:800;letter-spacing:.04em;font-size:15px}.arrow{display:inline-grid;place-items:center;width:27px;height:27px;margin-left:10px;border:1px solid rgba(255,255,255,.28);border-radius:50%}@media(max-width:500px){body{padding:0}.phone{width:100%;height:100dvh;border:0;border-radius:0}h1{font-size:17vw}}
  </style>
</head>
<body>
  <main class="phone">
    <img class="bg" src="../public/assets/world/dexo-land-foundation.webp" alt="" />
    <div class="scrim"></div><div class="atmo"></div>
    <div class="content">
      <header class="header"><img class="logo" src="../public/assets/brand/dalexio-logo.svg" alt="Dalexio" /></header>
      <button class="dev" aria-label="Open diagnostics">◉</button>
      <section class="hero">
        <div class="copy">
          <span class="eyebrow">Welcome to the world of</span>
          <h1 aria-label="Dexo Land"><span class="dexo">Dexo</span><span class="land">Land</span></h1>
          <p class="subtitle">A living world shaped by your missions, growth, clans and seasonal journey.</p>
        </div>
        <div></div>
        <button class="cta">Enter Dexo Land <span class="arrow">→</span></button>
      </section>
    </div>
  </main>
</body>
</html>
